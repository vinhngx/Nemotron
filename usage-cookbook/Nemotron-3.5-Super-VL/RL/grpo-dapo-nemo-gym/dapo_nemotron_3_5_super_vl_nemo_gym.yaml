# Four-node / 16-GPU text-only NeMoGym DAPO-17k reference configuration for
# Nemotron-3.5-Super-VL. Its initial one-step profile verifies Automodel, vLLM
# HTTP, Gym, the DAPO math verifier, and refit before longer campaigns.
defaults: /shared/code/RL/examples/configs/grpo_math_1B.yaml

grpo:
  max_num_steps: 1
  max_num_epochs: 1
  # Match the native Super-VL DAPO rollout batch: 32 prompts x 16 generations
  # = 512 samples per policy update. This divides evenly across 16 log-prob
  # shards in the colocated four-node topology.
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_val_samples: null
  val_at_start: false
  val_at_end: false
  use_dynamic_sampling: false
  overlong_filtering: false
  reward_scaling: {enabled: false}
  reward_shaping: {enabled: false}

loss_fn: {reference_policy_kl_penalty: 0.0}
checkpointing: {enabled: false}

policy:
  model_name: nvidia/nemotron-3.5-super-pre-ea-text-08282026
  # Match the native Super-VL DAPO recipe: math-only RL does not construct a
  # multimodal processor or send image inputs.
  is_vlm: false
  tokenizer:
    name: ${policy.model_name}
  hf_config_overrides: {num_nextn_predict_layers: 0}
  # Match the 32 x 16 rollout batch used by the native Super-VL DAPO recipe.
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  logprob_chunk_size: 1024
  # Reserve up to 2,048 tokens for a mathematical derivation while retaining
  # room for the problem prompt.
  max_total_sequence_length: 4096
  make_sequence_length_divisible_by: 8
  dynamic_batching: {enabled: true}
  sequence_packing: {enabled: false}
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  # Automodel's non-colocated initialization iterates this collection.
  # An empty list is the no-scheduler form; `null` raises TypeError there.
  scheduler: []
  dtensor_cfg:
    expert_parallel_size: 4
    activation_checkpointing: true
    moe_parallelizer: {ignore_router_for_ac: true}
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: te
        linear: te
        rms_norm: torch_fp32
        experts: gmm
        dispatcher: deepep
        fake_balanced_gate: false
        rope_fusion: false
        enable_hf_state_dict_adapter: true
  generation:
    backend: vllm
    # A 2,048-token response budget supports multi-step math reasoning and is
    # a practical starting point for this four-node profile.
    max_new_tokens: 2048
    temperature: 1.0
    vllm_cfg:
      tensor_parallel_size: 4
      expert_parallel_size: 4
      gpu_memory_utilization: 0.5
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: true
      # Avoid the experimental Mamba prefix-cache wake path in this profile.
      enable_prefix_caching: false
      async_engine: true
      expose_http_server: true
      skip_tokenizer_init: false
    colocated:
      # Training Super-VL with the fused Adam state needs all 16 GPUs. vLLM
      # releases its model allocation while Automodel trains, then is refit for
      # the next rollout.  A disaggregated 2-node policy slice OOMs at the
      # first optimizer step.
      enabled: true
      resources: {gpus_per_node: 4, num_nodes: 4}
    vllm_kwargs:
      # Super-VL's Mamba align cache uses a 2080-token block.  The vLLM
      # scheduler limit must be at least that large (the inherited 2048
      # default aborts engine initialization).
      max_num_batched_tokens: 4096
      moe_backend: triton
      disable_custom_all_reduce: true
      mamba_ssm_cache_dtype: float32
      skip_mm_profiling: true
      mm_processor_cache_gb: 0

data:
  max_input_seq_length: null
  shuffle: false
  num_workers: 0
  train:
    # Generated on the login/head node with the shared Ultra DAPO converter.
    # Keep generated data outside the cookbook repository.
    data_path: /shared/data/dapo17k/train.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
  # Generated on the login/head node with the same converter using
  # --skip 6400 --limit 256. The shared GRPO setup requires this dataset object
  # even though the initial one-step profile disables validation callbacks.
  validation:
    data_path: /shared/data/dapo17k/validation.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    nemo_gym_log_dir: /shared/runs/nemotron-3.5-super-vl-nemo-gym/nemo_gym
    skip_venv_if_present: true
    port_range_low: 5000
    port_range_high: 5999
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - resources_servers/math_with_judge/configs/dapo17k.yaml
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server: {name: policy_model}
          should_use_judge: false
          domain: math
          verified: false
    policy_model:
      responses_api_models:
        # Four TP=4 vLLM groups, one per GB200 node in the colocated layout.
        vllm_model: {num_workers: 4, num_groups_nemo_rl: 4}

logger:
  log_dir: /shared/runs/nemotron-3.5-super-vl-nemo-gym/logs
  wandb_enabled: false
  tensorboard_enabled: false
  monitor_gpus: true

# The interactive Ray job has four colocated policy/vLLM nodes.
cluster: {gpus_per_node: 4, num_nodes: 4}
